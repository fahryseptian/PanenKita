<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · PanenKita</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f0fdf4;
        color: #14532d;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 400px;
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #16a34a;
        color: #fff;
        font-weight: 700;
        font-size: 14px;
        padding: 8px 14px;
        border-radius: 999px;
      }
      h1 {
        font-size: 26px;
        margin: 20px 0 8px;
      }
      p {
        color: #166534;
        line-height: 1.6;
        margin: 0 0 20px;
      }
      button {
        background: #16a34a;
        color: #fff;
        border: 0;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 22px;
        border-radius: 12px;
        cursor: pointer;
      }
      button:hover {
        background: #15803d;
      }
      .hint {
        font-size: 13px;
        color: #15803d;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">🌾 PanenKita</span>
      <h1>Koneksi terputus</h1>
      <p>
        Koneksi internet sedang tidak tersedia. Cek sinyal Anda lalu coba muat
        ulang halaman ini.
      </p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
      <p class="hint">
        Halaman yang pernah Anda buka tetap bisa diakses dari cache.
      </p>
    </main>
  </body>
</html>
